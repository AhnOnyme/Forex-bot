[project]
name = "forex-bot"
version = "0.1.0"
description = "Agent de trading forex autonome (paper trading OANDA + decision LLM)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "oandapyV20>=0.7.2",
    "six>=1.16",  # dependance transitive d'oandapyV20, non declaree dans son package
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
